services:
  portal:
    build: .
    # LAN UI; Hermes uses an SSH tunnel for authenticated API calls.
    ports:
      - "${DAA_BIND_IP:-127.0.0.1}:6898:8080"
    volumes:
      - ./content:/content
    restart: unless-stopped
    environment:
      - CONTENT_DIR=/content
      - DAA_API_TOKEN=${DAA_API_TOKEN:?Set DAA_API_TOKEN in the protected .env file}
    read_only: false
    security_opt:
      - no-new-privileges:true
